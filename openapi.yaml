      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /project/group-and-count:
    post:
      tags:
      - Projects
      summary: Group and count projects
      description: |-
        Group projects by one or more fields and count each group. Accepts the same filters as the list endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAndCountBody'
      responses:
        '200':
          description: One row per group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAndCountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /project/bulk:
    patch:
      tags:
      - Projects
      summary: Update many projects
      description: |-
        Apply one set of changes to every project matching your filter.

        The filter must be in the **query string**. A filter in the body is ignored, and a request with no filter is rejected with `400` so you cannot update the whole table by accident.
      parameters:
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The updated projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Projects
      summary: Upsert many projects
      description: |-
        Insert or update many projects in one call. `update` is required: it lists the columns to overwrite when a row with a conflicting unique key already exists.
      parameters:
      - $ref: '#/components/parameters/update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: The upserted projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Projects
      summary: Delete many projects (not available)
      description: |-
        Not available on any resource. This route always returns `403`, so a broad filter can never wipe out a table in one call. Delete records one at a time, or archive them in bulk with `PATCH /project/bulk`.
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
  /project/{id}:
    get:
      tags:
      - Projects
      summary: Get a project
      description: Fetch one project by id.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags:
      - Projects
      summary: Update a project
      description: |-
        Change one project. Only the fields you send are touched.

        This is also how you archive and restore: send `{ "isArchived": true }` or `{ "isArchived": false }`.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Projects
      summary: Upsert a project
      description: |-
        Insert the project, or update it when a row with a conflicting unique key already exists. `update` is required and lists which columns to overwrite on conflict.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: The upserted project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Projects
      summary: Delete a project
      description: |-
        **Destructive.** Permanently removes the project row. This is not the archive operation and it cannot be undone.

        In practice this call fails with `409` for any project created through the API or the app. Every project owns at least one Jobsite location, and that link is `ON DELETE RESTRICT`, so the database refuses the delete while the Jobsite exists. Archive the project instead: `PATCH /project/{id}` with `{ "isArchived": true }`.

        If the delete does go through, `qc_inspection_set.projectId` on any related QC entry is set to `null` and the entry itself is kept.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
