        '429':
          $ref: '#/components/responses/RateLimited'
  /deliverable/work-sessions/save:
    post:
      tags:
      - Work sessions
      summary: Save work-session assignments
      description: |-
        Set who is working on what, and let BuildingSwell work out the difference.

        `assignments` is keyed by person id, and each value is the full list of deliverables that person should be on. The call compares that against their currently open sessions: it starts sessions for deliverables you added and stops sessions for ones you dropped. A person marked absent gets a saved plan instead of a live session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assignments
              - shopId
              properties:
                assignments:
                  type: object
                  description: |-
                    Keyed by person id. Each value is that person's full list of deliverable ids, with at least one entry.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                      format: uuid
                  example:
                    3fa85f64-5717-4562-b3fc-2c963f66afa6:
                    - 6f1d7c40-1f8e-4a1e-9f7b-2c963f66afa6
                shopId:
                  type: string
                  format: uuid
                  description: Department the sessions belong to.
                startDate:
                  type: string
                  format: date-time
                  description: When the sessions start. Defaults to now.
                shouldStopEntireBatch:
                  type: boolean
                  description: |-
                    Set this to stop the person's whole current batch rather than restarting the sessions you left in place.
      responses:
        '204':
          description: Saved. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /deliverable/work-sessions/stop:
    post:
      tags:
      - Work sessions
      summary: Stop work sessions
      description: |-
        Close open sessions by deliverable, by person, or by both.

        Send at least one of `deliverableIds` or `workerIds`. A request with neither is rejected: there is deliberately no way to stop every open session in one call.

        When a person has several open sessions, the elapsed time is split evenly across them, and any session you did not explicitly stop is restarted from that point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of `deliverableIds` or `workerIds` is required.
              properties:
                deliverableIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                    description: Deliverable id.
                  description: Stop open sessions on these deliverables.
                workerIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                    description: Person id.
                  description: Stop open sessions for these people.
                sessionIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                    description: Session id.
                  description: Stop these specific sessions.
                endDate:
                  type: string
                  format: date-time
                  description: |-
                    When the sessions end. Defaults to now. A value earlier than a session's start collapses that session to zero duration rather than going negative.
      responses:
        '204':
          description: Stopped. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /deliverable/work-sessions/error-ids:
    post:
      tags:
      - Work sessions
      summary: Find problem work sessions
      description: |-
        Return the ids of sessions that overlap another session for the same person, or that run past the shift they belong to. Takes the same filters as the list endpoint, in the body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBody'
      responses:
        '200':
          description: Ids of the sessions with each problem.
          content:
            application/json:
              schema:
                type: object
                description: One list per problem kind.
                properties:
                  overlapping:
                    type: array
                    items:
                      type: string
                      format: uuid
                      description: Session id.
                    description: Sessions that overlap another session for the same person.
                  overShift:
                    type: array
                    items:
                      type: string
                      format: uuid
                      description: Session id.
                    description: Sessions whose worked time exceeds the shift's available time.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
