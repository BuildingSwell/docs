          type: string
          description: Role name. At least one character.
          minLength: 1
        description:
          type: string
          description: What the role is for.
          nullable: true
        permissions:
          type: array
          description: Legacy flat permission strings. Defaults to empty.
          items:
            type: string
            description: Legacy permission string.
        permissionsV2:
          type: array
          description: Fine-grained permission statements. This is the form the app writes today.
          items:
            type: object
            description: One fine-grained permission statement.
            required:
            - subject
            - actions
            properties:
              subject:
                type: string
                description: What the statement is about, for example `worker` or `deliverable`.
              actions:
                type: array
                description: Actions the statement grants.
                items:
                  type: string
                  enum:
                  - read
                  - create
                  - update
                  - delete
                  description: One action.
              tableName:
                type: string
                description: Table the statement resolves against, when it differs from `subject`.
              filters:
                type: object
                description: Row filter limiting which records the statement covers.
                additionalProperties: true
              fields:
                type: object
                description: |-
                  Per-field limits, as a map from field name to the actions allowed on it (`read`, `update`).
                additionalProperties: true
        isApiKey:
          type: boolean
          description: '`true` for the synthetic role behind an API key. Leave it alone on roles you create.'
          default: false
