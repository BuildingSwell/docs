      parameters:
      - name: deliverableId
        in: query
        required: true
        description: Deliverable to report on. Repeat the parameter for each id.
        schema:
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - name: breakdown
        in: query
        description: Pass `true` to split the totals out per person and station.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: A map keyed by deliverable id. Each value holds the crew time rolled up for that
            node.
          content:
            application/json:
              schema:
                type: object
                description: Keyed by deliverable id.
                additionalProperties:
                  type: object
                  description: Crew time for one deliverable.
                  additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
