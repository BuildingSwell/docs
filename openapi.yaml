          description: Nodes trending late.
        onHold:
          type: integer
          description: Nodes on hold.
        currentPhases:
          type: array
          items:
            type: string
            description: Phase name.
          description: Phases on the active work frontier.
        currentStageIds:
          type: array
          items:
            type: string
            format: uuid
            description: Station id.
          description: Stations on the active work frontier.
    DeliverableComputed:
