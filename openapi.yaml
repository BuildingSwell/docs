        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Users
      summary: Upsert many users
      description: |-
        Insert or update many users in one call. `update` is required: it lists the columns to overwrite when a row with a conflicting unique key already exists.
      parameters:
      - $ref: '#/components/parameters/update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
