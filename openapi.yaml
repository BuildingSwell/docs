components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |-
        Organization-scoped API key. Create one in the BuildingSwell app under Organization settings, API keys.
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Record id.
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      description: 'Page to return, starting at 1. Pages are 1-based, so `page=0` is rejected with a `400`.'
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      description: Records per page. Defaults to 100 when no pagination parameter is sent. `/timesheet` applies no default at all, so send this explicitly.
      schema:
        type: integer
        default: 100
    orderBy:
      name: orderBy
      in: query
      description: Sort fields, e.g. name:asc,createdAt:desc. Comma-separated and repeated parameters are equivalent.
      schema:
        type: string
      example: name:asc
    select:
      name: select
      in: query
      description: Fields to return. Comma-separated or repeated parameters are equivalent; an explicit selection
        includes only requested fields. Nested JSON paths are supported.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
      - id
      - name
    search:
      name: search
      in: query
      description: |-
        Full-text search across the resource's search columns. Append `:col1,col2` to limit which columns are searched.
      schema:
        type: string
      example: warehouse
    filter:
      name: filter
      in: query
      description: |-
        AND/OR filter expression, for example `type eq 'phase' and isArchived eq false`. Simple equality can also be passed as plain field parameters.
      schema:
        type: string
      example: isArchived eq false
    update:
      name: update
      in: query
      required: true
      description: |-
        Columns to overwrite when the row already exists. Repeat the parameter for each column: a single comma-separated value is read as one column name and fails at the database. Without the parameter the request is rejected with `400`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
      - name
      - costCode
    timezone:
      name: timezone
      in: query
      description: |-
        IANA timezone used to render dates in the file, for example `America/New_York`. Defaults to UTC.
      schema:
        type: string
  schemas:
    CatalogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        catalog:
          type: string
          description: Which list this entry belongs to. Cannot be changed after creation.
          example: pay_type
        code:
          type: string
          description: The short value records store, by reference. Unique within the catalog.
          example: OT
        description:
          type: string
          nullable: true
          description: The human-readable name. Shown before the code in the app.
          example: Overtime
        isActive:
          type: boolean
          description: Whether the entry is offered for new records.
        sortOrder:
          type: integer
          description: Display order; ties break on code.
    CatalogEntryResponse:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/CatalogEntry'
    CatalogEntryListResponse:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
        hasMore:
          type: boolean
    CatalogEntryWriteRequest:
      type: object
      properties:
        catalog:
          type: string
          example: pay_type
        code:
          type: string
          example: OT
        description:
          type: string
          nullable: true
          example: Overtime
        isActive:
          type: boolean
        sortOrder:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: What went wrong, in plain language.
            code:
              type: string
              enum:
              - BAD_REQUEST
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - CONFLICT
              - VALIDATION
              - UNIQUE_VIOLATION
              - FK_VIOLATION
              - RATE_LIMITED
              - INTERNAL
              description: Stable machine-readable code. Branch on this rather than on the message text.
            requestId:
              type: string
              description: Id for this request. Quote it when you contact support.
            details:
              type: array
              items:
                type: object
                description: One field-level problem.
                properties:
                  path:
                    type: string
                    description: Field that failed, for example `data.stageId`.
                  message:
                    type: string
                    description: Why it failed.
                  code:
                    type: string
                    description: Validation code.
              description: Per-field problems. Present on validation failures only.
            missingPermissions:
              type: array
              items:
                type: string
                description: Permission name.
              description: Permissions your key is missing. Present on `403` only.
        context:
          type: object
          description: Extra context for the error. Usually empty.
          additionalProperties: true
    CountResponse:
      type: object
      properties:
        count:
          type: integer
          description: Records matching your filters.
    GroupAndCountBody:
      type: object
      required:
      - groupByField
      properties:
        groupByField:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: |-
            Field to group by, or several fields for a compound grouping. Nested paths work, for example `computed.projectId`.
        unnestGroupByField:
          type: boolean
          description: |-
            Set this when grouping by an array field, such as `computed.tags`, to count each value separately instead of counting whole arrays.
    GroupAndCountResponse:
      type: object
      properties:
        values:
          type: array
          items:
            type: object
            description: One group.
            properties:
              groupId:
                description: The grouped value. Its type follows the field you grouped by.
              count:
                type: integer
                description: Records in this group.
          description: One row per group.
        hasMore:
          type: boolean
          description: '`true` when another page is available.'
    QueryBody:
      type: object
      description: |-
        The same options the list endpoint takes in the query string. Any additional key is read as a field filter.
      properties:
        filter:
          type: string
          description: AND/OR filter expression.
        search:
          type: string
          description: Full-text search term.
        page:
          type: integer
          description: Page to return, starting at 1.
          default: 1
        pageSize:
          type: integer
          description: Records per page. Defaults to 100 when omitted.
          default: 100
        orderBy:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: Sort as `field:asc` or `field:desc`.
        select:
          type: array
          items:
            type: string
            description: Field name.
          description: Return only these fields.
      additionalProperties: true
    Project:
      type: object
      description: Projects group the orders and other work you deliver for one customer job.
      properties:
