      summary: Reactivate a user
      description: Give a deactivated user their access back, with the role they had.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Done. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /organization-member/{id}/invite/resend:
    post:
      tags:
      - Users
      summary: Resend a user invitation
      description: |-
        Send the invitation email again. Useful when the first one was missed and `appUser.status` is still `pending`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Sent. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts:
    get:
      tags:
      - Concepts
      summary: Get the concept registry
      description: |-
        The machine-readable model behind the concepts layer: every concept with its kind, which parents and children it allows, what it requires, its `data` fields, and whether it carries a schedule, progress, or a department.

        Read this once at integration time and you can validate node shapes yourself before writing.
      responses:
        '200':
          description: The registry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  concepts:
                    type: array
                    items:
                      type: object
                      description: One concept.
                      properties:
                        type:
                          type: string
                          enum:
                          - order
                          - route
                          - overhead
                          - template-phase
                          - phase
                          - component
                          - stage
                          - step
                          - qcstep
                          description: Concept name.
                        kind:
                          type: string
                          enum:
                          - root
                          - container
                          - work-node
                          - leaf
                          description: Where the concept sits in the grammar.
                        allowedParents:
                          type: array
                          items:
                            type: string
                            description: Concept name.
                          description: Concepts this one may nest under. Empty for roots.
                        allowedChildren:
                          type: array
                          items:
                            type: string
                            description: Concept name.
                          description: Concepts that may nest under this one. Empty for leaves.
                        requires:
                          type: array
                          items:
                            type: string
                            description: Field path.
                          description: Fields that must be present, for example `data.stageId`.
                        dataFields:
                          type: array
                          items:
                            type: string
                            description: Field name.
                          description: Keys this concept recognises in `data`.
                        identifier:
                          type: string
                          description: How the identifier is produced, for example `ORD-` for orders.
                          nullable: true
                        hasSchedule:
                          type: boolean
                          description: '`true` when the concept carries `schedule`.'
                        hasProgress:
                          type: boolean
                          description: '`true` when the concept carries `progress`.'
                        departmentScoped:
                          type: boolean
                          description: '`true` when the concept resolves a department.'
                    description: Every concept in the model.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/orders/{id}/context:
    get:
      tags:
      - Concepts
      summary: Get an order's context
      description: |-
        One compact object describing where an order stands: the order itself, counts and flags rolled up across its tree, and what is currently blocked.
      parameters:
      - $ref: '#/components/parameters/id'
      - name: blockedLimit
        in: query
        description: How many blocked nodes to return.
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: The order context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    format: uuid
                    description: The order.
                  order:
                    $ref: '#/components/schemas/ConceptNode'
                  rollup:
                    $ref: '#/components/schemas/TreeRollup'
                  blocked:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConceptNode'
                    description: Nodes waiting on something, capped by `blockedLimit`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/routes/{id}:
    get:
      tags:
      - Concepts
      summary: Get a route summary
      description: |-
        A route with counts and flags rolled up across its tree, in the same shape as the order context.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The route summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  routeId:
                    type: string
                    format: uuid
                    description: The route.
                  route:
                    $ref: '#/components/schemas/ConceptNode'
                  rollup:
                    $ref: '#/components/schemas/TreeRollup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/stage-masters:
    get:
      tags:
      - Concepts
      summary: List stations
      description: The stations available to link from stage nodes, optionally narrowed to one department.
      parameters:
      - name: departmentId
        in: query
        description: Department to filter by. Leave it off for every station.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The stations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/deliverables:
    post:
      tags:
      - Concepts
      summary: Create a deliverable with validation
      description: |-
        Create a node with the concept rules enforced: valid nesting, the fields that concept requires, station linkage, and department scoping.

        Anything outside the grammar is rejected, so a `step` under an `order` comes back as `400` rather than leaving a tree the app cannot show. Prefer this over `POST /deliverable`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - name
              properties:
                type:
                  type: string
                  enum:
                  - order
                  - route
                  - overhead
                  - template-phase
                  - phase
                  - component
                  - stage
                  - step
                  - qcstep
                  description: Concept to create.
                name:
                  type: string
                  description: Node name.
                parentId:
                  type: string
                  format: uuid
                  description: Node to nest under. Leave it off for a root.
                  nullable: true
                rootParentId:
                  type: string
                  format: uuid
                  description: Root of the tree.
                  nullable: true
                identifier:
                  type: string
                  description: Your own identifier. Generated when you leave it out.
                quantity:
                  type: integer
                  description: How many of this node the work covers.
                  default: 1
                cycleTimeSec:
                  type: integer
                  description: Cycle time per unit, in seconds.
                  default: 0
                durationSec:
                  type: integer
                  description: Total duration, in seconds.
                  default: 0
                peopleNum:
                  type: integer
                  description: How many people the node is planned for.
                  default: 1
                costCode:
                  type: string
                  description: Cost code.
                  nullable: true
                originTemplateId:
                  type: string
                  format: uuid
                  description: Route or template to build this node from. Setting it applies that structure
                    underneath.
                  nullable: true
                data:
                  type: object
                  description: |-
                    Per-concept fields. Which keys are required depends on `type`: an `order` needs `projectId`, an `overhead` needs `category`, a `qcstep` needs `qcTemplateId`. A `stage` node needs `stageId` unless a department can be resolved, in which case the station is found or created for you.
                  additionalProperties: true
      responses:
        '201':
          description: The created node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/deliverables/{id}:
    patch:
      tags:
      - Concepts
      summary: Update a deliverable with validation
      description: |-
        Change a node's `name`, `costCode`, or `data` with the same per-concept validation the create endpoint applies.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New node name.
                costCode:
                  type: string
                  description: New cost code.
                  nullable: true
                data:
                  type: object
                  description: Per-concept fields to change.
                  additionalProperties: true
      responses:
        '200':
          description: The updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/orders/from-route:
    post:
      tags:
      - Concepts
      summary: Create an order from a route
      description: |-
        Build a new order for a project by applying a route, which brings the route's whole structure with it. This is the normal way to start work that follows a standard process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - routeId
              - projectId
              - name
              properties:
                routeId:
                  type: string
                  format: uuid
                  description: Route to instantiate.
                projectId:
                  type: string
                  format: uuid
                  description: Project the order belongs to.
                name:
                  type: string
                  description: Name for the new order.
                identifier:
                  type: string
                  description: Your own identifier. Generated as `ORD-` when you leave it out.
                quantity:
                  type: integer
                  description: How many the order covers.
                  default: 1
                dueDate:
                  type: string
                  format: date-time
                  description: When the order is due.
      responses:
        '201':
          description: The new order's context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    format: uuid
                    description: The new order.
                  order:
                    $ref: '#/components/schemas/ConceptNode'
                  rollup:
                    $ref: '#/components/schemas/TreeRollup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/deliverables/{id}/apply-route:
    post:
      tags:
      - Concepts
      summary: Apply a route to a node
      description: |-
        Add a route's structure underneath an existing `order`, `phase`, or `component`.

        Routes compose recursively and are cycle-protected. A route scoped to a department overrides the target's department.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - routeId
              properties:
                routeId:
                  type: string
                  format: uuid
                  description: Route to apply.
      responses:
        '200':
          description: The updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/root/{rootId}/progress/{id}/plan:
    post:
      tags:
      - Concepts
      summary: Preview a progress action
      description: |-
        Work out what a progress action would do without writing anything. Use it before a destructive action such as `rework` so you can show the consequences first.
      parameters:
      - name: rootId
        in: path
        required: true
        description: Root of the tree the node belongs to.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressAction'
      responses:
        '200':
          description: What the action would change.
          content:
            application/json:
              schema:
                type: object
                description: The planned effect. Nothing has been written.
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /concepts/root/{rootId}/progress/{id}/apply:
    post:
      tags:
      - Concepts
      summary: Apply a progress action
      description: |-
        Apply the action for real. It cascades through the tree, stops work sessions, and clears daily-plan assignments for nodes that become `done`.

        Call `/plan` first if you want to show the effect before committing.
      parameters:
      - name: rootId
        in: path
        required: true
        description: Root of the tree the node belongs to.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressAction'
      responses:
        '200':
          description: What the action changed.
          content:
            application/json:
              schema:
                type: object
                description: The applied effect.
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |-
        Organization-scoped API key. Create one in the BuildingSwell app under Organization settings, API keys.
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Record id.
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      description: 'Page to return, starting at 1. Pages are 1-based, so `page=0` is rejected with a `400`.'
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      description: Records per page. Defaults to 100 when no pagination parameter is sent. `/timesheet` applies no default at all, so send this explicitly.
      schema:
        type: integer
        default: 100
    orderBy:
      name: orderBy
      in: query
      description: |-
        Sort as `field:asc` or `field:desc`. Repeat the parameter to sort by more than one field.
      schema:
        type: string
      example: name:asc
    select:
      name: select
      in: query
      description: |-
        Return only these fields. Repeat the parameter for each field: a single comma-separated value is rejected with `400`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
      - id
      - name
    search:
      name: search
      in: query
      description: |-
        Full-text search across the resource's search columns. Append `:col1,col2` to limit which columns are searched.
      schema:
        type: string
      example: warehouse
    filter:
      name: filter
      in: query
      description: |-
        AND/OR filter expression, for example `type eq 'phase' and isArchived eq false`. Simple equality can also be passed as plain field parameters.
      schema:
        type: string
      example: isArchived eq false
    update:
      name: update
      in: query
      required: true
      description: |-
        Columns to overwrite when the row already exists. Repeat the parameter for each column: a single comma-separated value is read as one column name and fails at the database. Without the parameter the request is rejected with `400`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
      - name
      - costCode
    timezone:
      name: timezone
      in: query
      description: |-
        IANA timezone used to render dates in the file, for example `America/New_York`. Defaults to UTC.
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: What went wrong, in plain language.
            code:
              type: string
              enum:
              - BAD_REQUEST
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - CONFLICT
              - VALIDATION
              - UNIQUE_VIOLATION
              - FK_VIOLATION
              - RATE_LIMITED
              - INTERNAL
              description: Stable machine-readable code. Branch on this rather than on the message text.
            requestId:
              type: string
              description: Id for this request. Quote it when you contact support.
            details:
              type: array
              items:
                type: object
                description: One field-level problem.
                properties:
                  path:
                    type: string
                    description: Field that failed, for example `data.stageId`.
                  message:
                    type: string
                    description: Why it failed.
                  code:
                    type: string
                    description: Validation code.
              description: Per-field problems. Present on validation failures only.
            missingPermissions:
              type: array
              items:
                type: string
                description: Permission name.
              description: Permissions your key is missing. Present on `403` only.
        context:
          type: object
          description: Extra context for the error. Usually empty.
          additionalProperties: true
    CountResponse:
      type: object
      properties:
        count:
          type: integer
          description: Records matching your filters.
    GroupAndCountBody:
      type: object
      required:
      - groupByField
      properties:
        groupByField:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: |-
            Field to group by, or several fields for a compound grouping. Nested paths work, for example `computed.projectId`.
        unnestGroupByField:
          type: boolean
          description: |-
            Set this when grouping by an array field, such as `computed.tags`, to count each value separately instead of counting whole arrays.
    GroupAndCountResponse:
      type: object
      properties:
        values:
          type: array
          items:
            type: object
            description: One group.
            properties:
              groupId:
                description: The grouped value. Its type follows the field you grouped by.
              count:
                type: integer
                description: Records in this group.
          description: One row per group.
        hasMore:
          type: boolean
          description: '`true` when another page is available.'
    QueryBody:
      type: object
      description: |-
        The same options the list endpoint takes in the query string. Any additional key is read as a field filter.
      properties:
        filter:
          type: string
          description: AND/OR filter expression.
        search:
          type: string
          description: Full-text search term.
        page:
          type: integer
          description: Page to return, starting at 1.
          default: 1
        pageSize:
          type: integer
          description: Records per page. Defaults to 100 when omitted.
          default: 100
        orderBy:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: Sort as `field:asc` or `field:desc`.
        select:
          type: array
          items:
            type: string
            description: Field name.
          description: Return only these fields.
