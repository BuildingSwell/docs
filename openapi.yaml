          - admin
          - custom
          description: '`admin` grants everything. `custom` follows `roleId`.'
          default: custom
        status:
          type: string
          enum:
          - active
          - deactivated
          description: Whether the user can sign in.
          default: active
        createdAt:
          type: string
          format: date-time
          description: When the record was created.
        updatedAt:
          type: string
          format: date-time
          description: When the record last changed.
    OrganizationMemberUpdate:
      type: object
      description: |-
        Every field is optional. Only the fields you send are changed. `email` is not updatable: it identifies the login and is owned by the identity provider.
      properties:
        name:
          type: string
          minLength: 1
          description: Display name. Written to the linked user account, so it comes back as `appUser.name` rather than on the membership.
        roleId:
          type: string
          format: uuid
          description: Role the user carries.
          nullable: true
        roleType:
          type: string
          enum:
          - admin
          - custom
          description: '`admin` grants everything. `custom` follows `roleId`.'
          default: custom
        workerId:
          type: string
          format: uuid
          description: Person record to link this user to. Pass `null` to unlink. Write-only — it is stored on the person, not on the membership.
          nullable: true
    OrganizationMemberSingleResponse:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/OrganizationMember'
    OrganizationMemberMultiResponse:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'
    OrganizationMemberListResponse:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'
        hasMore:
          type: boolean
          description: '`true` when another page is available.'
    ScheduleAction:
      description: |-
        A scheduling action, keyed on `type`. Times are **epoch seconds**, not ISO strings. For `schedule`, `drag`, `shrink`, and `expand` you send only one of `newStart` or `newFinish`; the engine derives the other from duration and dependencies.
      oneOf:
      - type: object
        description: Place a node on the calendar for the first time.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - schedule
            description: Initial placement.
          newStart:
            type: integer
            description: New start, epoch seconds.
          newFinish:
            type: integer
            description: New finish, epoch seconds.
      - type: object
        description: Move a node without changing how long it takes.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - drag
            description: Move, keeping duration.
          newStart:
            type: integer
            description: New start, epoch seconds.
          newFinish:
            type: integer
            description: New finish, epoch seconds.
      - type: object
        description: Change how long a node takes, anchored at its start or its finish.
        required:
        - type
        - newDuration
        properties:
          type:
            type: string
            enum:
            - shrink
            - expand
            description: Change duration.
          newDuration:
            type: integer
            description: New duration, in seconds.
          newStart:
            type: integer
            description: Anchor the change at this start, epoch seconds.
          newFinish:
            type: integer
            description: Anchor the change at this finish, epoch seconds.
      - type: object
        description: Recompute the node from its dependencies. Takes no other fields.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - reschedule
            description: Recompute from dependencies.
    ProgressAction:
      description: |-
        A progress action, keyed on `type`. Send this rather than patching the `progress` object directly.
      oneOf:
      - type: object
        description: Actions that take no other fields.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - complete
            - rework
            - put-on-hold
            - resume-work
            description: |-
              `complete` finishes the remaining quantity. `rework` sends the node back. `put-on-hold` and `resume-work` toggle the hold.
      - type: object
        description: Actions that take a quantity.
        required:
        - type
        - quantity
        properties:
          type:
            type: string
            enum:
            - uncomplete
            - send-ahead
            description: |-
              `uncomplete` moves finished quantity back to work in progress. `send-ahead` finishes quantity ahead of dependencies.
          quantity:
            type: number
            description: How much to move.
            minimum: 0
      - type: object
        description: Set a completion percentage. Not allowed on `qcstep` nodes.
        required:
        - type
        - percentage
        properties:
          type:
            type: string
            enum:
            - set-percentage
            description: Set a percentage.
          percentage:
            type: number
            description: Percent complete.
            minimum: 0
            maximum: 100
    ConceptNode:
      type: object
      description: |-
        A deliverable as the concepts layer returns it: the node's own fields plus its resolved concept context.
      properties:
        id:
          type: string
          format: uuid
          description: Node id.
        identifier:
          type: string
          description: Human-readable id.
        name:
          type: string
          description: Node name.
        type:
          type: string
          enum:
          - order
          - route
          - overhead
          - template-phase
          - phase
          - component
          - stage
          - step
          - qcstep
          description: Concept this node represents.
        parentId:
          type: string
          format: uuid
          description: Node directly above this one.
          nullable: true
        rootParentId:
          type: string
          format: uuid
          description: Root of the tree.
          nullable: true
        quantity:
          type: integer
          description: How many of this node the work covers.
        cycleTimeSec:
          type: integer
          description: Cycle time per unit, in seconds.
        durationSec:
          type: integer
          description: Total duration, in seconds.
        peopleNum:
          type: integer
          description: How many people the node is planned for.
        costCode:
          type: string
          description: Cost code.
          nullable: true
        data:
          type: object
          description: Per-concept fields for this `type`.
          additionalProperties: true
        computed:
          $ref: '#/components/schemas/DeliverableComputed'
    TreeRollup:
      type: object
      description: Counts and flags rolled up across a whole tree.
      properties:
        nodeCount:
          type: integer
          description: Nodes in the tree.
        byType:
          type: object
          description: Node count per `type`.
          additionalProperties: true
        byStatus:
          type: object
          description: Node count per progress status.
          additionalProperties: true
        edges:
          type: integer
          description: Dependency links in the tree.
        late:
          type: integer
          description: Nodes past their date.
        atRisk:
          type: integer
          description: Nodes trending late.
        onHold:
          type: integer
          description: Nodes on hold.
        currentPhases:
          type: array
          items:
            type: string
            description: Phase name.
          description: Phases on the active work frontier.
        currentStageIds:
          type: array
          items:
            type: string
            format: uuid
            description: Station id.
          description: Stations on the active work frontier.
    DeliverableComputed:
      description: Same shape as `computed` on a deliverable. All read-only.
      allOf:
      - type: object
        description: Derived tree values.
        additionalProperties: true
    IdBatch:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
            description: Record id.
          description: Ids to act on. At least one is required.
  responses:
    BadRequest:
      description: |-
        The request was malformed or failed validation. Check `error.details` for the fields at fault.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The `X-API-Key` header is missing or the key is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |-
        Your key lacks the permission for this call. `error.missingPermissions` lists what is needed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No record with that id in your organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |-
        The write conflicts with existing data: a duplicate unique value (`UNIQUE_VIOLATION`), or a related record that blocks it (`FK_VIOLATION`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: |-
        Too many requests. Read `RateLimit-Reset` for when to retry. This response also carries a top-level `message` alongside `error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
