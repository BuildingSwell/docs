    DeliverableWorkSession:
      type: object
      description: Time one person logged against one deliverable. An open session has no `endDate`.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id. Generated on create unless you supply one.
        organizationId:
          type: string
          format: uuid
          description: Your organization. Taken from the API key, never from the request body.
        deliverableId:
          type: string
          format: uuid
          description: Deliverable the time was logged against.
        workerId:
          type: string
          format: uuid
          description: Person who did the work.
        shopId:
          type: string
          format: uuid
          description: Department the session belongs to.
        startDate:
          type: string
          format: date-time
          description: Effective start in UTC. The hours-rounding job can rewrite it; rawStart preserves the original.
        endDate:
          type: string
          format: date-time
          description: Effective end in UTC; null while open. The hours-rounding job can rewrite it; rawEnd preserves
            the original.
          nullable: true
        isEdited:
          type: boolean
          description: '`true` when someone has edited the session by hand.'
          default: false
        lastUpdatedBy:
          type: string
          format: uuid
          description: Who last changed the session.
          nullable: true
        shiftWorkHours:
          type: object
          description: The shift the record was worked against. Break times are local wall-clock, not
            UTC.
          nullable: true
          required:
          - startTime
          - endTime
          properties:
            startTime:
              type: string
              description: Shift start as local wall-clock time, `HH:mm`.
              example: 08:00
            endTime:
              type: string
              description: Shift end as local wall-clock time, `HH:mm`.
              example: '17:00'
            breaks:
              type: array
              description: Scheduled unpaid breaks for the shift. Omitted when the shift has none.
              items:
                type: object
                description: One scheduled break.
                required:
                - startTime
                - durationInSec
                properties:
                  startTime:
                    type: string
                    description: Break start as local wall-clock time, `HH:mm`.
                    example: '12:00'
                  durationInSec:
                    type: integer
                    description: How long the break lasts, in seconds.
                    example: 1800
            timezone:
              type: string
              description: |-
                IANA timezone of the shop the shift belongs to, stamped server-side. `breakTimeInSec` anchors each break's local time to this zone. Defaults to `UTC` when absent.
              example: America/New_York
        breakTimeInSec:
          type: integer
          description: |-
            Unpaid break seconds that fall inside this record's start/end window. The database derives it whenever the record is written, from `startDate`, `endDate`, and `shiftWorkHours`. Read-only: it cannot be written, and it is `0` while the record is still open.
          nullable: true
        externalSource:
          type: string
          description: System the session came from, for example `quickbase`.
          nullable: true
        externalSync:
          type: string
          description: Sync state for the external system.
          default: not synced
          example: synced
        metadata:
          type: object
          description: |-
            Free-form key-value store. No key is guaranteed to be present, and a missing key is not the same as a `null` one. See the resource guide for which paths populate `costCode` and `unionCode`.
          example:
            costCode: WELD-100
            unionCode: LOCAL-7
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: When the record was created.
        updatedAt:
          type: string
          format: date-time
          description: When the record last changed.
        rawStart:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Original clock start preserved when that boundary is processed. Null means this boundary
            has not been processed; fall back to startDate.
        rawEnd:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Original clock end preserved when that boundary is processed. Null means this boundary
            has not been processed; fall back to endDate.
