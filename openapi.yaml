      summary: Get a deliverable
      description: Fetch one deliverable by id.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: The deliverable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverableSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags:
      - Deliverables
      summary: Update a deliverable
      description: |-
        Change one deliverable. Only the fields you send are touched.

        This is also how you archive and restore: send `{ "isArchived": true }` or `{ "isArchived": false }`.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverableUpdate'
      responses:
        '200':
          description: The updated deliverable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverableSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Deliverables
      summary: Upsert a deliverable
      description: |-
        Insert the deliverable, or update it when a row with a conflicting unique key already exists. `update` is required and lists which columns to overwrite on conflict.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverableCreate'
      responses:
        '200':
          description: The upserted deliverable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverableSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Deliverables
      summary: Delete a deliverable
      description: |-
        **Destructive.** Permanently removes the node **and every node beneath it**. This is not the archive operation and it cannot be undone. Prefer `PATCH /deliverable/{id}` with `{ "isArchived": true }`, which cascades the same way and is reversible.

        Before the rows go, BuildingSwell relinks what pointed at them so you do not silently lose time or QC history:

        - Work sessions and QC entries on any deleted node are moved onto the nearest surviving ancestor.
        - Dependency links touching any deleted node are removed with it.
        - When there is no surviving ancestor, which is the case when you delete a root order, the call is rejected with `400` if the subtree has work sessions or QC entries. Archive it instead.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
