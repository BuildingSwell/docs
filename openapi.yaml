      responses:
        '200':
          description: Ids of the sessions with each problem.
          content:
            application/json:
              schema:
                type: object
                description: One list per problem kind.
                properties:
                  overlapping:
                    type: array
                    items:
                      type: string
                      format: uuid
                      description: Session id.
                    description: Sessions that overlap another session for the same person.
                  overShift:
                    type: array
                    items:
                      type: string
                      format: uuid
                      description: Session id.
                    description: Sessions whose worked time exceeds the shift's available time.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
