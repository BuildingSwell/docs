        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags:
      - Users
      summary: Update an user
      description: Change one user. Only the fields you send are touched.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMemberUpdate'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Users
      summary: Upsert an user
      description: |-
        Insert the user, or update it when a row with a conflicting unique key already exists. `update` is required and lists which columns to overwrite on conflict.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMemberCreate'
      responses:
        '200':
          description: The upserted user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Users
      summary: Delete an user
      description: |-
        **Destructive.** Permanently removes the membership, which cuts the user's access to your organization. This cannot be undone.

        To take access away reversibly, use `PATCH /organization-member/{id}/deactivate` instead. That keeps the membership and its history, and it can be reversed with `/reactivate`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /organization-member/{id}/deactivate:
    patch:
      tags:
      - Users
      summary: Deactivate a user
      description: |-
        Take away a user's access while keeping the membership and its history. This is the reversible alternative to deleting the membership. Undo it with `/reactivate`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Done. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
