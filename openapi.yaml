        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Users
      summary: Delete many users (not available)
      description: |-
        Not available on any resource. This route always returns `403`, so a broad filter can never wipe out a table in one call. Delete records one at a time, or archive them in bulk with `PATCH /organization-member/bulk`.
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
  /organization-member/{id}:
    get:
      tags:
      - Users
      summary: Get an user
