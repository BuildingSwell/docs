    ScheduleAction:
      description: |-
        A scheduling action, keyed on `type`. Times are **epoch seconds**, not ISO strings. For `schedule`, `drag`, `shrink`, and `expand` you send only one of `newStart` or `newFinish`; the engine derives the other from duration and dependencies.
      oneOf:
      - type: object
        description: Place a node on the calendar for the first time.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - schedule
            description: Initial placement.
          newStart:
            type: integer
            description: New start, epoch seconds.
          newFinish:
            type: integer
            description: New finish, epoch seconds.
      - type: object
        description: Move a node without changing how long it takes.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - drag
            description: Move, keeping duration.
          newStart:
            type: integer
            description: New start, epoch seconds.
          newFinish:
            type: integer
            description: New finish, epoch seconds.
      - type: object
        description: Change how long a node takes, anchored at its start or its finish.
        required:
        - type
        - newDuration
        properties:
          type:
            type: string
            enum:
            - shrink
            - expand
            description: Change duration.
          newDuration:
            type: integer
            description: New duration, in seconds.
          newStart:
            type: integer
            description: Anchor the change at this start, epoch seconds.
          newFinish:
            type: integer
            description: Anchor the change at this finish, epoch seconds.
      - type: object
        description: Recompute the node from its dependencies. Takes no other fields.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - reschedule
            description: Recompute from dependencies.
    ProgressAction:
      description: |-
        A progress action, keyed on `type`. Send this rather than patching the `progress` object directly.
      oneOf:
      - type: object
        description: Actions that take no other fields.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - complete
            - rework
            - put-on-hold
            - resume-work
            description: |-
              `complete` finishes the remaining quantity. `rework` sends the node back. `put-on-hold` and `resume-work` toggle the hold.
      - type: object
        description: Actions that take a quantity.
        required:
        - type
        - quantity
        properties:
          type:
            type: string
            enum:
            - uncomplete
            - send-ahead
            description: |-
              `uncomplete` moves finished quantity back to work in progress. `send-ahead` finishes quantity ahead of dependencies.
          quantity:
            type: number
            description: How much to move.
            minimum: 0
      - type: object
        description: Set a completion percentage. Not allowed on `qcstep` nodes.
        required:
        - type
        - percentage
        properties:
          type:
            type: string
            enum:
            - set-percentage
            description: Set a percentage.
          percentage:
            type: number
            description: Percent complete.
            minimum: 0
            maximum: 100
    ConceptNode:
      type: object
      description: |-
        A deliverable as the concepts layer returns it: the node's own fields plus its resolved concept context.
      properties:
        id:
          type: string
          format: uuid
          description: Node id.
        identifier:
          type: string
          description: Human-readable id.
        name:
          type: string
          description: Node name.
        type:
          type: string
          enum:
          - order
          - route
          - overhead
          - template-phase
          - phase
          - component
          - stage
          - step
          - qcstep
          description: Concept this node represents.
        parentId:
          type: string
          format: uuid
          description: Node directly above this one.
          nullable: true
        rootParentId:
          type: string
          format: uuid
          description: Root of the tree.
          nullable: true
        quantity:
          type: integer
          description: How many of this node the work covers.
        cycleTimeSec:
          type: integer
          description: Cycle time per unit, in seconds.
        durationSec:
          type: integer
          description: Total duration, in seconds.
        peopleNum:
          type: integer
          description: How many people the node is planned for.
        costCode:
          type: string
          description: Cost code.
          nullable: true
        data:
