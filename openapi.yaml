    Timesheet:
      type: object
      description: |-
        Every time-tracking record in one place: attendance check-ins and deliverable work sessions, read through a single shape.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id of the underlying attendance or work-session row.
        organizationId:
          type: string
          format: uuid
          description: Your organization. Taken from the API key.
        type:
          type: string
          enum:
          - attendance
          - deliverable_work_session
          description: Which kind of record this is. Only these two exist.
        workerId:
          type: string
          format: uuid
          description: Person the time belongs to. Resolve names through `/worker`.
        shopId:
          type: string
          format: uuid
          description: Department the record belongs to.
        startDate:
          type: string
          format: date-time
          description: When the record started, in UTC.
        endDate:
          type: string
          format: date-time
          description: When the record ended, in UTC. `null` means it is still open.
          nullable: true
        deliverableId:
          type: string
          format: uuid
          description: |-
            Deliverable the time was logged against. Populated for `deliverable_work_session` rows only, and `null` for `attendance`.
          nullable: true
        shiftWorkHours:
          type: object
          description: The shift the record was worked against. Break times are local wall-clock, not
            UTC.
          nullable: true
          required:
          - startTime
          - endTime
          properties:
            startTime:
              type: string
              description: Shift start as local wall-clock time, `HH:mm`.
              example: 08:00
            endTime:
              type: string
              description: Shift end as local wall-clock time, `HH:mm`.
              example: '17:00'
            breaks:
              type: array
              description: Scheduled unpaid breaks for the shift. Omitted when the shift has none.
              items:
                type: object
                description: One scheduled break.
                required:
                - startTime
                - durationInSec
                properties:
                  startTime:
                    type: string
                    description: Break start as local wall-clock time, `HH:mm`.
                    example: '12:00'
                  durationInSec:
                    type: integer
                    description: How long the break lasts, in seconds.
                    example: 1800
            timezone:
              type: string
              description: |-
                IANA timezone of the shop the shift belongs to, stamped server-side. `breakTimeInSec` anchors each break's local time to this zone. Defaults to `UTC` when absent.
              example: America/New_York
        breakTimeInSec:
          type: integer
          description: |-
            Unpaid break seconds that fall inside this record's start/end window. The database derives it whenever the record is written, from `startDate`, `endDate`, and `shiftWorkHours`. Read-only: it cannot be written, and it is `0` while the record is still open.
          nullable: true
        isEdited:
          type: boolean
          description: '`true` when someone has edited the record by hand.'
        lastUpdatedBy:
          type: string
          format: uuid
          description: Who last changed the record.
          nullable: true
        metadata:
          type: object
          description: |-
            Free-form key-value store. No key is guaranteed to be present, and a missing key is not the same as a `null` one. See the resource guide for which paths populate `costCode` and `unionCode`.
          example:
            costCode: WELD-100
            unionCode: LOCAL-7
          additionalProperties: true
        externalSource:
          type: string
          description: System the record came from, for example `quickbase`.
          nullable: true
        externalSync:
          type: string
          description: 'Sync state for the external system. Free-form text, not an enum: `synced`, `not synced`, `not_synced`, `none`, and the Quickbase job''s `synced start date` / `synced start and end date` all occur. Match loosely, or filter with `externalSync:ne=synced`.'
          example: synced
        stageId:
          type: string
          format: uuid
          description: Always `null`. Kept in the shape for backward compatibility.
          nullable: true
        buildOrderId:
          type: string
          format: uuid
          description: Always `null`. Kept in the shape for backward compatibility.
          nullable: true
        overheadId:
          type: string
          format: uuid
          description: Always `null`. Kept in the shape for backward compatibility.
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: When the record was created.
        updatedAt:
          type: string
          format: date-time
          description: When the record last changed.
