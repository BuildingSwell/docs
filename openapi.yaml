  /deliverable/crew-time:
    post:
      tags:
      - Deliverables
      summary: Get crew time for deliverables
      description: |-
        Crew time rolled up for each deliverable you ask about. Use this form rather than the `GET` below: it takes the ids in the body, so it does not run into URL length limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - deliverableId
