          type: string
          format: uuid
          description: Person who did the work.
        shopId:
          type: string
          format: uuid
          description: Department the session belongs to.
        startDate:
          type: string
          format: date-time
          description: When the session started, in UTC.
        endDate:
          type: string
          format: date-time
          description: When the session ended, in UTC. `null` means it is still open.
          nullable: true
        isEdited:
          type: boolean
          description: '`true` when someone has edited the session by hand.'
          default: false
        lastUpdatedBy:
          type: string
          format: uuid
          description: Who last changed the session.
          nullable: true
        shiftWorkHours:
          type: object
          description: The shift the record was worked against. Break times are local wall-clock, not
            UTC.
          nullable: true
          required:
          - startTime
          - endTime
          properties:
            startTime:
              type: string
              description: Shift start as local wall-clock time, `HH:mm`.
              example: 08:00
            endTime:
              type: string
              description: Shift end as local wall-clock time, `HH:mm`.
              example: '17:00'
            breaks:
              type: array
              description: Scheduled unpaid breaks for the shift. Omitted when the shift has none.
              items:
                type: object
                description: One scheduled break.
                required:
