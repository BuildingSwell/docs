    Deliverable:
      type: object
      description: |-
        One generic work-tree node. Its `type` decides which domain concept it represents, from an order down to a single step.
      properties:
        id:
          type: string
          format: uuid
          description: Unique id. Generated on create unless you supply one.
        organizationId:
          type: string
          format: uuid
          description: Your organization. Taken from the API key, never from the request body.
        identifier:
          type: string
          description: |-
            Human-readable id, unique within your organization. Generated for you when you leave it out.
        name:
          type: string
          description: Display name.
        isArchived:
          type: boolean
          description: |-
            Archived records are hidden from list results unless you ask for them. Set this to archive or restore the record.
          default: false
        archivedAt:
          type: string
          format: date-time
          description: |-
            When the record was archived. Set automatically when `isArchived` flips to `true`, and cleared on restore.
          nullable: true
        archivedById:
          type: string
          format: uuid
          description: 'Who archived the record. Server-managed: a value you send is ignored.'
          nullable: true
        type:
          type: string
          enum:
          - order
          - route
          - overhead
          - template-phase
          - phase
          - component
          - stage
          - step
          - qcstep
          - group
          description: Which concept this node represents.
        quantity:
          type: integer
          description: How many of this node the work covers.
          default: 1
        parentId:
          type: string
          format: uuid
          description: Node directly above this one.
          nullable: true
        rootParentId:
          type: string
          format: uuid
          description: Root of this node's tree. A root node points at itself.
          nullable: true
        originTemplateId:
          type: string
          format: uuid
          description: Route or template this node was built from.
          nullable: true
        cycleTimeSec:
          type: integer
          description: Cycle time per unit, in seconds.
          default: 0
        durationSec:
          type: integer
          description: Total duration, in seconds.
          default: 0
        peopleNum:
          type: integer
          description: How many people the node is planned for.
          default: 1
        data:
          type: object
          description: |-
            Per-concept fields. Which keys apply depends on `type`: a stage node needs `stageId`, an order needs `projectId`, and so on. See the domain concepts guide for the full table.
          example:
            stageId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          additionalProperties: true
          properties:
            properties:
              type: object
              additionalProperties: true
              description: Custom-property values keyed by immutable catalog key, on orders only. Requires customPropertiesEnabled;
                current disabled writes silently discard this key. Nonempty objects merge; null or {} clears all
                values.
        costCode:
          type: string
          description: |-
            Cost code. Trimmed on write, and an empty string is rejected: send a non-empty string or `null`.

            Stored as a plain string. It is not validated against the cost code list, and renaming an entry in that list does not change this value.
          nullable: true
        schedule:
          type: object
          description: Scheduled window for the node. Present on `order` nodes only.
          nullable: true
          properties:
            startDate:
              type: string
              format: date-time
              description: Scheduled start.
            endDate:
              type: string
              format: date-time
              description: Scheduled finish.
        progress:
          type: object
          description: |-
            Progress for the node. Present on `order` nodes only. Write it through the progress action endpoint rather than by patching this object.
          nullable: true
          properties:
            status:
              type: string
              enum:
              - waiting
              - todo
              - wip
              - rework
              - on-hold
              - done
              description: Where the work stands right now.
            completed:
              type: number
              description: Quantity finished.
              default: 0
              minimum: 0
            wip:
              type: number
              description: Quantity in progress.
              default: 0
              minimum: 0
            percentage:
              type: number
              description: Percent complete, 0 to 100.
              default: 0
              minimum: 0
            startedAt:
              type: string
              format: date-time
              description: When work first started.
              nullable: true
            completedAt:
              type: string
              format: date-time
              description: When the node reached `done`.
              nullable: true
            hasBeenReworked:
              type: boolean
              description: |-
                `true` once the node has ever been set to `rework`. Server-managed, and it stays `true` after the status changes again.
              default: false
            updatedById:
              type: string
              format: uuid
              description: Who last changed progress. Server-managed, and `null` for transitions into
                `waiting`.
              nullable: true
            updatedAt:
              type: string
              format: date-time
              description: When progress last changed. Server-managed, and `null` for transitions into
                `waiting`.
              nullable: true
        computed:
          type: object
          description: |-
            Values BuildingSwell derives from the tree on every read. All read-only: anything you send here is ignored.
          properties:
            rootType:
              type: string
              enum:
              - order
              - route
              - overhead
              - template-phase
              - phase
              - component
              - stage
              - step
              - qcstep
              - group
              description: '`type` of the root node of this tree.'
              nullable: true
            fullName:
              type: array
              description: Name breadcrumb from the root down to this node.
              items:
                type: string
                description: Node name.
            fullPath:
              type: array
              description: Id breadcrumb from the root down to this node.
              items:
                type: string
                format: uuid
                description: Node id.
            shopId:
              type: string
              format: uuid
              description: |-
                Department that applies to this node, inherited from the nearest ancestor when the node does not set one. `null` means cross-department.
              nullable: true
            phasesPath:
              type: array
              description: Phase names in this node's ancestry.
              items:
                type: string
                description: Phase name.
            phase:
              type: string
              description: Nearest phase name above this node.
              nullable: true
            currentChildren:
              type: array
              description: Summary of the node's direct children.
              items:
                type: object
                description: One direct child.
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Child id.
                  name:
                    type: string
                    description: Child name.
                  stageId:
                    type: string
                    format: uuid
                    description: Station the child links to, when it is a stage node.
                    nullable: true
                  type:
                    type: string
                    enum:
                    - order
                    - route
                    - overhead
                    - template-phase
                    - phase
                    - component
                    - stage
                    - step
                    - qcstep
                    description: Child type.
            containedStageIds:
              type: array
              description: Every station anywhere beneath this node.
              items:
                type: string
                format: uuid
                description: Station id.
                nullable: true
            containedPhaseNames:
              type: array
              description: Every phase name anywhere beneath this node.
              items:
                type: string
                description: Phase name.
            containedCurrentStageIds:
              type: array
              description: Stations beneath this node that sit on the active work frontier.
              items:
                type: string
                format: uuid
                description: Station id.
                nullable: true
            containedCurrentPhaseNames:
              type: array
              description: Phase names beneath this node that sit on the active work frontier.
              items:
                type: string
                description: Phase name.
            currentStageIds:
              type: array
              description: Stations on this node's own active work frontier. Filter it with the `jinco`
                operator.
              items:
                type: string
                format: uuid
                description: Station id.
            currentPhaseNames:
              type: array
              description: Phase names on this node's own active work frontier.
              items:
                type: string
                description: Phase name.
            combinedWorkerIds:
              type: array
              description: Everyone assigned anywhere beneath this node.
              items:
                type: string
                format: uuid
                description: Person id.
            combinedTagIds:
              type: array
              description: Every tag anywhere beneath this node.
              items:
                type: string
                description: Tag id.
            workerIds:
              type: array
              description: People assigned directly to this node.
              items:
                type: string
                format: uuid
                description: Person id.
            tags:
              type: array
              description: Tags on this node itself.
              items:
                type: string
                description: Tag id.
            isLeaf:
              type: boolean
              description: '`true` when the node has no children.'
              default: true
            projectId:
              type: string
              format: uuid
              description: Project this tree belongs to.
              nullable: true
            date:
              type: string
              description: Effective date for the node.
              nullable: true
            isAtRisk:
              type: boolean
              description: '`true` when the node is trending late.'
              default: false
            isLate:
              type: boolean
              description: '`true` when the node has missed its date.'
              default: false
            effectiveDueDate:
              type: string
              description: Due date that applies, whether set here or inherited.
              nullable: true
            effectiveDueDateIsInherited:
              type: boolean
              description: '`true` when the due date comes from an ancestor.'
              default: false
            effectiveDueDateIsLate:
              type: boolean
              description: '`true` when the effective due date has passed.'
              default: false
            hasReworkedStages:
              type: boolean
              description: '`true` when any stage beneath this node has been reworked.'
              default: false
            groupIds:
              type: array
              items:
                type: string
                format: uuid
              readOnly: true
              description: IDs of group deliverables containing this node. Maintained from group.data.itemIds.
        alertType:
          type: string
          enum:
          - on-hold
          - late
          - at-risk
          - no-risk
          description: |
            Highest-priority alert state for the node. Derived on every read, and
            returned at the top level rather than inside `computed`.
