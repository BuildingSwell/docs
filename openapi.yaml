# Generated for the BuildingSwell v2 public API.
# Field-level detail is derived from server models; see the
# bswl-sync-docs skill for how to keep this in step with code.
openapi: 3.0.3
info:
  title: BuildingSwell Public API
  version: 2.0.0
  description: |
    The BuildingSwell v2 public API. Every request needs an `X-API-Key` header, and
    every key is scoped to one organization, so you only ever see your own data.

    Base URL: `https://app.buildingswell.com/api/v2`

    Most resources share the same CRUD and query shape. Read the
    [standard endpoints](/guides/standard-endpoints) and
    [querying](/guides/querying) guides once and the rest of this reference follows
    the same rules. For what a delete actually removes, see
    [archiving and deleting](/guides/archiving-and-deleting).
servers:
- url: https://{instance}/api/v2
  description: Your BuildingSwell instance
  variables:
    instance:
      default: app.buildingswell.com
      description: Your BuildingSwell host
security:
- ApiKeyAuth: []
tags:
- name: Projects
  description: Customer jobs, and the archive behavior they share with most resources.
- name: Stages
  description: Reusable shop stations, scoped to a department.
- name: Deliverables
  description: 'The work tree: orders, routes, phases, components, stages, steps, and QC steps.'
- name: Work sessions
  description: Time logged by one person against one deliverable.
- name: Dependencies
  description: Scheduling links between deliverables.
- name: Documents
  description: Files attached to orders.
- name: QC
  description: QC templates and the inspection sets filled from them.
- name: People (Workers)
  description: Your workforce roster. Called People in the app and `worker` in the API.
- name: Timesheets
  description: Read-only view over attendance and work sessions.
- name: Codes
  description: Cost, union, and per diem code lists. Referenced by value, not by id.
- name: Roles
  description: Permission roles, and the statements that make them up.
- name: Users
  description: People with a BuildingSwell login. Called Users in the app and `organization-member` in
    the API.
- name: Concepts
  description: Deliverable writes with the nesting rules enforced.
- name: Items
  description: Material and part definitions, purchasing units, and availability.
- name: Item vendors
  description: Supplier SKUs linked to items.
- name: Inventory stock
  description: Read-only quantities by item and location.
- name: Inventory transactions
  description: The inventory ledger and its posting rules.
- name: Inventory allocations
  description: Read-only reservations for orders and projects.
- name: BOM lines
  description: Planned material inputs for routes, orders, and projects.
- name: Production outputs
  description: Declarations of manufactured outputs.
- name: Units of measure
  description: Reusable names and abbreviations for quantities.
- name: Vendors
  description: Suppliers, manufacturers, and subcontractors.
- name: Locations
  description: Department and project locations for storage and delivery.
- name: Deliveries
  description: Inbound receipts, outbound trips, and transfers.
- name: Delivery lines
  description: Material and ad-hoc manifest lines.
- name: Trucks
  description: Fleet vehicles and their capacity.
- name: Contacts
  description: Drivers, receivers, and other business contacts.
- name: Project contacts
  description: Links between projects and contacts.
- name: Teams
  description: Read-only department teams.
- name: Shifts
  description: Read-only department shifts.
- name: Departments (shops)
  description: Read-only departments, called shops in the API.
- name: Custom properties
  description: Organization property definitions and values on orders.
paths:
  /project:
    get:
      tags:
      - Projects
      summary: List projects
      description: |-
        List and filter projects. Supports pagination, sorting, field selection, search, filters, and joins.

        Full-text `search` covers `name`, `identifier`.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/orderBy'
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - Projects
      summary: Create a project
      description: |-
        Create one project, or several at once by sending an array.

        Only `name` is required. Creating a project also creates one project-owned Jobsite location in the same transaction, so a project always has somewhere to ship to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ProjectCreate'
              - type: array
                items:
                  $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: The created project. An array request returns `values` instead of `value`.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProjectSingleResponse'
                - $ref: '#/components/schemas/ProjectMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /project/count:
    get:
      tags:
      - Projects
      summary: Count projects
      description: Count the projects matching your filters.
      parameters:
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: The matching count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - Projects
      summary: Count projects (POST)
      description: |-
        Same as `GET /project/count`, with the filters in the request body. Use this when your filter is too long for a URL.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBody'
      responses:
        '200':
          description: The matching count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /project/query:
    post:
      tags:
      - Projects
      summary: Query projects
      description: |-
        Same as `GET /project`, with the query in the request body. Use this when your filter or `select` list is too long for a URL.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBody'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /project/group-and-count:
    post:
      tags:
      - Projects
      summary: Group and count projects
      description: |-
        Group projects by one or more fields and count each group. Accepts the same filters as the list endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAndCountBody'
      responses:
        '200':
          description: One row per group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAndCountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /project/bulk:
    patch:
      tags:
      - Projects
      summary: Update many projects
      description: |-
        Apply one set of changes to every project matching your filter.

        The filter must be in the **query string**. A filter in the body is ignored, and a request with no filter is rejected with `400` so you cannot update the whole table by accident.
      parameters:
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The updated projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Projects
      summary: Upsert many projects
      description: |-
        Insert or update many projects in one call. `update` is required: it lists the columns to overwrite when a row with a conflicting unique key already exists.
      parameters:
      - $ref: '#/components/parameters/update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: The upserted projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Projects
      summary: Delete many projects (not available)
      description: |-
        Not available on any resource. This route always returns `403`, so a broad filter can never wipe out a table in one call. Delete records one at a time, or archive them in bulk with `PATCH /project/bulk`.
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
  /project/{id}:
    get:
      tags:
      - Projects
      summary: Get a project
      description: Fetch one project by id.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags:
      - Projects
      summary: Update a project
      description: |-
        Change one project. Only the fields you send are touched.

        This is also how you archive and restore: send `{ "isArchived": true }` or `{ "isArchived": false }`.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Projects
      summary: Upsert a project
      description: |-
        Insert the project, or update it when a row with a conflicting unique key already exists. `update` is required and lists which columns to overwrite on conflict.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: The upserted project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Projects
      summary: Delete a project
      description: |-
        **Destructive.** Permanently removes the project row. This is not the archive operation and it cannot be undone.

        In practice this call fails with `409` for any project created through the API or the app. Every project owns at least one Jobsite location, and that link is `ON DELETE RESTRICT`, so the database refuses the delete while the Jobsite exists. Archive the project instead: `PATCH /project/{id}` with `{ "isArchived": true }`.

        If the delete does go through, `qc_inspection_set.projectId` on any related QC entry is set to `null` and the entry itself is kept.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
