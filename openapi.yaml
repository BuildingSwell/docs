        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /organization-member/bulk:
    patch:
      tags:
      - Users
      summary: Update many users
      description: |-
        Apply one set of changes to every user matching your filter.

        The filter must be in the **query string**. A filter in the body is ignored, and a request with no filter is rejected with `400` so you cannot update the whole table by accident.
      parameters:
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMemberUpdate'
      responses:
        '200':
          description: The updated users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Users
      summary: Upsert many users
      description: |-
        Insert or update many users in one call. `update` is required: it lists the columns to overwrite when a row with a conflicting unique key already exists.
      parameters:
      - $ref: '#/components/parameters/update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationMemberCreate'
      responses:
        '200':
          description: The upserted users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Users
      summary: Delete many users (not available)
      description: |-
        Not available on any resource. This route always returns `403`, so a broad filter can never wipe out a table in one call. Delete records one at a time, or archive them in bulk with `PATCH /organization-member/bulk`.
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
  /organization-member/{id}:
    get:
