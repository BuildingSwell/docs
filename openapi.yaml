                deliverableId:
                  type: array
                  items:
                    type: string
                    format: uuid
                    description: Deliverable id.
                  description: Deliverables to report on. At least one is required.
                breakdown:
                  type: boolean
                  description: |-
                    Set this to split the totals out per person and station instead of returning one rolled-up figure.
      responses:
        '200':
          description: A map keyed by deliverable id. Each value holds the crew time rolled up for that
            node.
          content:
            application/json:
              schema:
                type: object
                description: Keyed by deliverable id.
                additionalProperties:
                  type: object
                  description: Crew time for one deliverable.
                  additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags:
      - Deliverables
      summary: Get crew time for deliverables (deprecated)
      description: |-
