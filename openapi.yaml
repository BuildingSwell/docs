        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Codes
      summary: Upsert a per diem code
      description: |-
        Insert the per diem code, or update it when a row with a conflicting unique key already exists. `update` is required and lists which columns to overwrite on conflict.

