# Generated for the BuildingSwell v2 public API.
# Field-level detail is derived from server models; see the
# bswl-sync-docs skill for how to keep this in step with code.
openapi: 3.0.3
info:
  title: BuildingSwell Public API
  version: 2.0.0
  description: |
    The BuildingSwell v2 public API. Every request needs an `X-API-Key` header, and
    every key is scoped to one organization, so you only ever see your own data.

    Base URL: `https://app.buildingswell.com/api/v2`

    Most resources share the same CRUD and query shape. Read the
    [standard endpoints](/guides/standard-endpoints) and
    [querying](/guides/querying) guides once and the rest of this reference follows
    the same rules. For what a delete actually removes, see
    [archiving and deleting](/guides/archiving-and-deleting).
servers:
- url: https://{instance}/api/v2
  description: Your BuildingSwell instance
  variables:
    instance:
      default: app.buildingswell.com
      description: Your BuildingSwell host
security:
- ApiKeyAuth: []
tags:
- name: Projects
  description: Customer jobs, and the archive behavior they share with most resources.
- name: Stages
  description: Reusable shop stations, scoped to a department.
- name: Deliverables
  description: 'The work tree: orders, routes, phases, components, stages, steps, and QC steps.'
- name: Work sessions
  description: Time logged by one person against one deliverable.
- name: Dependencies
  description: Scheduling links between deliverables.
- name: Documents
  description: Files attached to orders.
- name: QC
  description: QC templates and the inspection sets filled from them.
- name: People (Workers)
  description: Your workforce roster. Called People in the app and `worker` in the API.
- name: Timesheets
  description: Read-only view over attendance and work sessions.
- name: Codes
  description: Cost, union, and per diem code lists. Referenced by value, not by id.
- name: Roles
  description: Permission roles, and the statements that make them up.
- name: Users
  description: People with a BuildingSwell login. Called Users in the app and `organization-member` in the API.
- name: Concepts
  description: Deliverable writes with the nesting rules enforced.
paths:
  /project:
    get:
      tags:
      - Projects
      summary: List projects
      description: |-
        List and filter projects. Supports pagination, sorting, field selection, search, filters, and joins.

        Full-text `search` covers `name`, `identifier`.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/orderBy'
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - Projects
      summary: Create a project
      description: |-
        Create one project, or several at once by sending an array.

        Only `name` is required. Creating a project also creates one project-owned Jobsite location in the same transaction, so a project always has somewhere to ship to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ProjectCreate'
              - type: array
                items:
                  $ref: '#/components/schemas/ProjectCreate'
      responses:
        '200':
          description: The created project. An array request returns `values` instead of `value`.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProjectSingleResponse'
                - $ref: '#/components/schemas/ProjectMultiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /project/count:
    get:
      tags:
      - Projects
      summary: Count projects
      description: Count the projects matching your filters.
      parameters:
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: The matching count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - Projects
      summary: Count projects (POST)
      description: |-
        Same as `GET /project/count`, with the filters in the request body. Use this when your filter is too long for a URL.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBody'
      responses:
        '200':
          description: The matching count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /project/query:
    post:
      tags:
      - Projects
      summary: Query projects
      description: |-
        Same as `GET /project`, with the query in the request body. Use this when your filter or `select` list is too long for a URL.
      requestBody:
        required: false
        content:
          application/json:
            schema:
